limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
map $uri $auth_limit_key {
    default "";
    ~^/api/v1/auth/(login|register|refresh)$ $binary_remote_addr;
}
limit_req_zone $auth_limit_key zone=auth_per_ip:10m rate=5r/s;
# Keep precise search coordinates and place queries out of access logs.
log_format nearperk '$request_method $uri $status $request_time';
# Docker's embedded DNS refreshes service addresses after container recreation.
upstream nearperk_api {
    zone nearperk_api 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server backend:8000 resolve;
}
server {
    access_log /var/log/nginx/access.log nearperk;
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;
    server_tokens off;
    client_max_body_size 64k;
    client_body_timeout 10s;
    large_client_header_buffers 4 8k;
    limit_req_status 429;
    include /etc/nginx/security-headers.conf;
    location /api/ {
        limit_req zone=api_per_ip burst=60 nodelay;
        limit_req zone=auth_per_ip burst=10 nodelay;
        proxy_read_timeout 30s;
        proxy_send_timeout 15s;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_pass http://nearperk_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
