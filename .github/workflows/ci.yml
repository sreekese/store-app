name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: nearperk
          POSTGRES_PASSWORD: nearperk_ci
          POSTGRES_DB: nearperk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nearperk -d nearperk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://nearperk:nearperk_ci@localhost:5432/nearperk_test
      TEST_DATABASE_URL: postgresql+psycopg://nearperk:nearperk_ci@localhost:5432/nearperk_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: ruff check . && ruff format --check .
      - run: mypy app
      - run: alembic upgrade head && alembic check
      - run: pytest -q
      - run: python -m build
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint && npm run format:check && npm run typecheck
      - run: npm audit --audit-level=low
      - run: npm test
      - run: npm run build
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .security-tools && .security-tools/bin/pip install -r backend/requirements-security.lock
      - run: .security-tools/bin/pip-audit -r backend/requirements-dev.lock --no-deps --disable-pip
      - run: .security-tools/bin/bandit -r backend/app
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 120
      - run: curl --fail http://localhost:8000/ready && curl --fail http://localhost:5173/api/v1/status
      - run: docker compose up -d --no-deps --force-recreate --wait backend
      - run: curl --fail --retry 10 --retry-delay 1 --retry-all-errors http://localhost:5173/api/v1/status
      - if: always()
        run: docker compose logs --no-color && docker compose down
